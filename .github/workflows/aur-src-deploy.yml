name: Publish source package to AUR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., v0.2.9)'
        required: true

jobs:
  update-aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          ver="${{ inputs.version_name || github.ref_name }}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Create PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"
          pkgver="${ver#v}"
          mkdir -p aur-package
          cat > aur-package/PKGBUILD <<'EOF'
          # Maintainer: MLM-stuff <gfxoxinzh@mozmail.com>
          pkgname=soredowe
          pkgver={{PKGVER}}
          pkgrel=1
          pkgdesc="Experimental GUI for pacman/AUR users who prefer it (Wayland/Vulkan)"
          arch=('x86_64' 'aarch64')
          url="https://github.com/mlm-games/soredowe"
          license=('GPL3')
          depends=(
            'pacman'
            'flatpak'
            'polkit'
            'wayland'
            'vulkan-icd-loader'
            'fontconfig'
            'hicolor-icon-theme'
          )
          makedepends=('rustup' 'base-devel')
          options=('!lto')
          provides=('soredowe')
          conflicts=('soredowe-bin')
          source=("${pkgname}-${pkgver}.tar.gz::https://github.com/mlm-games/soredowe/archive/refs/tags/v${pkgver}.tar.gz")
          sha256sums=('SKIP')

          build() {
            cd "${srcdir}/${pkgname}-${pkgver}"
            cargo build --release --locked -p app_shell
          }

          package() {
            cd "${srcdir}/${pkgname}-${pkgver}"
            install -Dm755 "target/release/soredowe-desktop" "${pkgdir}/usr/bin/soredowe"

            install -Dm644 /dev/stdin "${pkgdir}/usr/share/applications/soredowe.desktop" << DESKTOP_EOF
          [Desktop Entry]
          Name=soredowe
          Comment=GUI for pacman/AUR users who prefer it (Wayland/Vulkan)
          Exec=soredowe
          Icon=soredowe
          Terminal=false
          Type=Application
          Categories=System;PackageManager;
          StartupNotify=true
          DESKTOP_EOF

            install -Dm644 "packaging/icons/hicolor/scalable/apps/soredowe.svg" \
              "${pkgdir}/usr/share/pixmaps/soredowe.svg"
          }
          EOF

          sed -i "s/{{PKGVER}}/${pkgver}/g" aur-package/PKGBUILD

      - name: Publish to AUR
        uses: mlm-games/aur-deploy-action@master
        with:
          pkgname: soredowe
          pkgbuild: aur-package/PKGBUILD
          auto_pkgrel: 'true'
          commit_username: MLM-stuff
          commit_email: gfxoxinzh@mozmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
