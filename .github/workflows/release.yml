      #     sudo sed -Ei 's|^Types: deb|Types: deb\nArchitectures: amd64|' /etc/apt/sources.list.d/ubuntu.sources
      #     sudo apt update
      #     sudo apt install -y \
      #       gcc-aarch64-linux-gnu \
      #       pkg-config pkgconf \
      #       libflatpak-dev:arm64 \
      #       libalpm-dev:arm64
      #     echo 'PKG_CONFIG_ALLOW_CROSS=1'                >> "$GITHUB_ENV"
