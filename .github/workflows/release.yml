      #     }
      #     Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            dist/**/*.tar.gz
            dist/**/*.zip

