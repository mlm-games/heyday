name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      upload_releases:
        description: "Upload releases"
        required: true
        default: true
        type: boolean
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bin-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: soredowe
  CARGO_TERM_COLOR: always

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      tag: ${{ steps.meta.outputs.tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      release_notes: ${{ steps.notes.outputs.release-notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine version/tag based on event:
      # - push on tag vX.Y.Z: use that tag/version, don't bump Cargo.toml
      # - workflow_dispatch: bump patch in Cargo.toml, commit, push
      - name: Set version/tag metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            ref_name="${GITHUB_REF_NAME}"
            if [[ ! "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag name: $ref_name (expected vX.Y.Z)" >&2
              exit 1
            fi
            version="${ref_name#v}"
            tag="$ref_name"
            commit_sha="$(git rev-parse HEAD)"
          else
            CARGO_TOML="Cargo.toml"

            OLD_VERSION=$(grep -m1 '^version\s*=\s*"' "$CARGO_TOML" | sed -E 's/.*"([^"]+)".*/\1/')
            if [[ -z "$OLD_VERSION" ]]; then
              echo "Could not detect package.version in Cargo.toml" >&2
              exit 1
            fi
            IFS='.' read -r MAJ MIN PAT <<<"$OLD_VERSION"; : "${MAJ:=0}" "${MIN:=0}" "${PAT:=0}"
            NEW_VERSION="$MAJ.$MIN.$((PAT+1))"
            sed -i -E "0,/^version\s*=.*/s//version = \"$NEW_VERSION\"/" "$CARGO_TOML"

            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            cargo update -w
            git add . || true
            git commit -m "Update cargo ver with lock"
            git push

            version="$NEW_VERSION"
            tag="v${version}"
            commit_sha="$(git rev-parse HEAD)"
          fi

          {
            echo "version_name=$version"
            echo "tag=$tag"
            echo "commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        uses: mlm-games/release-notes-generator@main
        with:
          version: ${{ steps.meta.outputs.version_name }}
          format: "- {{subject}}"
          exclude-patterns: "chore:,ci:,docs:,build:,Bump version,Merge pull request,[skip ci]"
          auto-commit: "false"

  build:
    name: Build and package (desktop)
    needs: prepare-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            toolchain: stable
            target: ""
          - os: ubuntu-26.04-arm
            toolchain: stable
            target: ""  # Linux ARM64
          # - os: macos-latest
          #   toolchain: stable
          #   target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}


      - name: Add Rust target (when cross-compiling)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Host Linux deps (x86_64)
      - name: Install Linux dependencies (host)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config pkgconf \
            libflatpak-dev \
            libalpm-dev

