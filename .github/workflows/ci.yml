name: CI
on:
  pull_request:
  push:
    branches: "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  check-and-test:
    name: Check, lint, test (stable)
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config pkgconf \
            libflatpak-dev \
            libalpm-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build
