[workspace]
members = [
  "crates/domain",
  "crates/backend_alpm",
  "crates/backend_aur",
  "crates/backend_flatpak",
  "crates/backend_packagekit",
  "crates/backend_appimage",
  "crates/app_ui",
  "crates/app_shell",
]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"

[workspace.dependencies]
crossbeam-channel = "0.5.15"
thiserror = "2"
parking_lot = "0.12"
anyhow = "1"
env_logger = "0.11"
regex = "1.12"
nix = { version = "0.31", default-features = false, features = ["signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
tempfile = "3"
log = "0.4"

# Package management
alpm = "5"
libflatpak = "0.7"
packagekit-zbus = "0.2"
ureq = { version = "3", features = ["json"] }

# UI
repose-core = "0.22"
repose-devtools = "0.22"
repose-material = "0.22"
repose-navigation = "0.22"
repose-platform = "0.22"
repose-render-wgpu = "0.22"
repose-text = "0.22"
repose-tree = "0.22"
repose-ui = "0.22"
colorhash = "0.1"
bigcolor = "1.2"
rfd = "0.17"
shlex = "2"


# [patch.crates-io]
# repose-core = { path = "../repose/crates/repose-core" }
# repose-ui = { path = "../repose/crates/repose-ui" }
# repose-platform = { path = "../repose/crates/repose-platform" }
# repose-material = { path = "../repose/crates/repose-material" }
# repose-navigation = { path = "../repose/crates/repose-navigation" }


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
